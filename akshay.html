<title>PDF Analyzer</title>

<!-- Puter.js -->
<script src="https://js.puter.com/v2/"></script>

<!-- PDF.js -->
<script type="module">
    import * as pdfjsLib
        from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    window.pdfjsLib = pdfjsLib;
</script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 30px;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
        margin-top: 0;
    }

    .description {
        color: #555;
        line-height: 1.6;
    }

    .file-area {
        margin-top: 25px;
        padding: 25px;
        border: 2px dashed #aaa;
        border-radius: 10px;
        text-align: center;
    }

    input[type="file"] {
        margin: 15px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 22px;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    button:disabled {
        background: #999;
        cursor: not-allowed;
    }

    #status {
        margin-top: 20px;
        padding: 14px;
        border-radius: 7px;
        background: #eef2ff;
    }

    #result {
        margin-top: 25px;
        padding: 25px;
        background: #fafafa;
        border: 1px solid #ddd;
        border-radius: 8px;
        white-space: pre-wrap;
        line-height: 1.7;
    }

    .file-name {
        font-weight: bold;
        color: #2563eb;
    }
</style>
